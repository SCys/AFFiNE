name: Build Selfhost Docker Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry'
        type: boolean
        default: true
      tag_latest:
        description: 'Tag as latest'
        type: boolean
        default: true
      custom_tag:
        description: 'Custom tag (optional, e.g. 0.20.0)'
        type: string
        default: ''
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare Metadata
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      git_short_hash: ${{ steps.meta.outputs.git_short_hash }}
      image_name: ${{ steps.meta.outputs.image_name }}
      docker_tags: ${{ steps.meta.outputs.docker_tags }}
      should_push: ${{ steps.meta.outputs.should_push }}
    steps:
      - uses: actions/checkout@v4
      - name: Calculate metadata
        id: meta
        shell: bash
        run: |
          GIT_SHORT_HASH=$(git rev-parse --short HEAD)
          echo "git_short_hash=$GIT_SHORT_HASH" >> "$GITHUB_OUTPUT"

          # Determine version
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            APP_VERSION="${{ github.event.inputs.custom_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            PACKAGE_VERSION=$(jq -r '.version // "0.0.0"' package.json)
            APP_VERSION="${PACKAGE_VERSION}-${GIT_SHORT_HASH}"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

          # Lowercase image repository name
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

          # Build tags list
          TAGS="${IMAGE_NAME}:${APP_VERSION},${IMAGE_NAME}:${GIT_SHORT_HASH}"
          if [ "${{ github.ref }}" = "refs/heads/master" ] || [ "${{ github.event.inputs.tag_latest }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          echo "docker_tags=$TAGS" >> "$GITHUB_OUTPUT"

          # Should push
          SHOULD_PUSH="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.push }}" = "false" ]; then
            SHOULD_PUSH="false"
          fi
          echo "should_push=$SHOULD_PUSH" >> "$GITHUB_OUTPUT"

  build-web:
    name: Build @affine/web
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app_version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Build Web
        run: yarn affine @affine/web build
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: ./packages/frontend/apps/web/dist
          if-no-files-found: error

  build-admin:
    name: Build @affine/admin
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app_version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Build Admin
        run: yarn affine @affine/admin build
      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin
          path: ./packages/frontend/admin/dist
          if-no-files-found: error

  build-mobile:
    name: Build @affine/mobile
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app_version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Build Mobile
        run: yarn affine @affine/mobile build
      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist
          if-no-files-found: error

  build-server-native:
    name: Build Server native (${{ matrix.targets.file }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        targets:
          - name: x86_64-unknown-linux-gnu
            file: server-native.x64.node
          - name: aarch64-unknown-linux-gnu
            file: server-native.arm64.node
    steps:
      - uses: actions/checkout@v4
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app_version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server-native
      - name: Build Rust
        uses: ./.github/actions/build-rust
        with:
          package: '@affine/server-native'
          target: ${{ matrix.targets.name }}
      - name: Rename native addon
        shell: bash
        run: |
          mv ./packages/backend/native/server-native.node ./packages/backend/native/${{ matrix.targets.file }}
      - name: Upload ${{ matrix.targets.file }}
        uses: actions/upload-artifact@v4
        with:
          name: server-native-${{ matrix.targets.file }}
          path: ./packages/backend/native/${{ matrix.targets.file }}
          if-no-files-found: error

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-server-native
    steps:
      - uses: actions/checkout@v4
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app_version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server @types/affine__env
      - name: Download server-native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: server-native-*
          merge-multiple: true
          path: ./packages/backend/native
      - name: Prepare native addons and list
        shell: bash
        run: |
          touch ./packages/backend/native/server-native.armv7.node
          ls -alh ./packages/backend/native
      - name: Build Server
        run: yarn workspace @affine/server build
      - name: Upload server dist
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist
          if-no-files-found: error

  build-images:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-server
      - build-web
      - build-mobile
      - build-admin
    steps:
      - uses: actions/checkout@v4

      - name: Download server dist
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: ./packages/frontend/apps/web/dist

      - name: Download mobile artifact
        uses: actions/download-artifact@v4
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist

      - name: Download admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin
          path: ./packages/frontend/admin/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install production dependencies & Generate Prisma
        run: |
          corepack enable
          yarn config set --json supportedArchitectures.cpu '["x64", "arm64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production
          yarn workspace @affine/server prisma generate
          mv ./node_modules ./packages/backend/server

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ needs.prepare.outputs.app_version }}

      - name: Login to GitHub Container Registry
        if: ${{ needs.prepare.outputs.should_push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ needs.prepare.outputs.should_push == 'true' }}
          pull: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          file: .github/deployment/node/Dockerfile
          tags: ${{ needs.prepare.outputs.docker_tags }}
